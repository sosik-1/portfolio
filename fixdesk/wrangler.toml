name = "fixdesk"
main = "src/index.js"
compatibility_date = "2026-10-15"
compatibility_flags = ["nodejs_compat"]

# 실행 위치 고정: 한국 요청이 홍콩 데이터센터에서 처리되면 Anthropic API가 403(지원 안 되는 지역)으로 막아요.
# 그래서 Anthropic API 서버 가까운 곳(미국)에서 실행되도록 고정해요.
# 2026-11-07: hostname 방식이 홍콩(HKG)으로 잡혀 AI 403 → 미국 동부로 직접 지정
[placement]
region = "aws:us-east-1"

# 예약 작업: 1분마다 노션에서 바꾼 상태를 가져와요 (src/integrations.js pullFromNotion)
[triggers]
crons = ["* * * * *"]

# 화면 파일 (index.html = 고객 접수, admin.html = 관리자)
[assets]
directory = "./public"
binding = "ASSETS"

# 접수 저장소 (SQLite). 2026-11-05에 `wrangler d1 create fixdesk-db`로 만든 클라우드 DB
[[d1_databases]]
binding = "DB"
database_name = "fixdesk-db"
database_id = "2bb392bb-c07b-4a7c-884a-342a3749b8bd"

# 비밀값은 여기 적지 않아요:
#   ANTHROPIC_API_KEY, ADMIN_PASSWORD, DEMO_PASSWORD
#   연동(선택): SLACK_WEBHOOK_URL, SHEET_WEBHOOK_URL·SHEET_SECRET(구글 시트), NOTION_TOKEN·NOTION_DB_ID
#   → 배포: wrangler secret put 이름 / 로컬: .dev.vars 파일
